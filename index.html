<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Skolan.se</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    height: 100%;
}

body {
    background: rgb(0, 0, 0);
}

.bol {
    width: 60px;
    height: 60px;
    position: absolute;
    z-index: 2;
}

.platform {
    position: absolute;
    height: 10px;
    background: rgb(20, 10, 20);
    border-radius: 3px;
}

.gräss {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.dash-shadow {
    position: absolute;
    width: 60px;
    height: 60px;
    opacity: 1.6;
    filter: blur(2px);
    z-index: 1;
    animation: fadeOut 0.3s linear forwards;
}

.Enes {
    width: 70px;
    height: 70px;
    position: absolute;
    left: 80%;
    top: 35%;
}

@keyframes fadeOut {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.25); }
}

.Hecktor {
    position: absolute;
    width: 60px;
    height: 60px;
    top: 0%;
    left: 1px;
}
</style>
</head>

<body>

<img src="IMG_20260504_144159.jpg" class="bol">
<img src="oliver.webp" class="gräss">
<img src="Enes.jpg" class="Enes">
<img src="Hecktor.webp" class="Hecktor">

<script>
let jul = document.querySelector(".bol");
let enes = document.querySelector(".Enes");

let julX = 100;
let julY = 100;
let julVelY = 0;
let julLeft = false;
let julRight = false;
let julWallLeft = false;
let julWallRight = false;

let enesX = window.innerWidth * 0.80;
let enesY = window.innerHeight * 0.35;
let enesVelY = 0;
let enesLeft = false;
let enesRight = false;
let enesWallLeft = false;
let enesWallRight = false;

let gravity = 1.4;

let platforms = [
    {x: 150, y: 550, w: 120},
    {x: 350, y: 480, w: 100},
    {x: 600, y: 420, w: 90},
    {x: 850, y: 350, w: 80},
    {x: 600, y: 280, w: 80},
    {x: 350, y: 220, w: 70},
    {x: 150, y: 150, w: 60}
];

platforms.forEach(p => {
    let el = document.createElement("div");
    el.className = "platform";
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.style.width = p.w + "px";
    document.body.appendChild(el);
});

function dashShadow(img, x, y) {
    let shadow = document.createElement("img");
    shadow.src = img.src;
    shadow.className = "dash-shadow";
    shadow.style.left = x + "px";
    shadow.style.top = y + "px";
    document.body.appendChild(shadow);
    setTimeout(() => shadow.remove(), 300);
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") julLeft = true;
    if (e.key === "ArrowRight") julRight = true;

    if (e.key === "ArrowUp") {
        if (julWallLeft) { julVelY = -17; julX += 18; }
        else if (julWallRight) { julVelY = -17; julX -= 18; }
        else julVelY = -17;
    }

    if (e.key === ".") { dashShadow(jul, julX, julY); julX += 180; }
    if (e.key === "-") { dashShadow(jul, julX, julY); julX -= 180; }

    if (e.key === "a") enesLeft = true;
    if (e.key === "d") enesRight = true;

    if (e.key === "w") {
        if (enesWallLeft) { enesVelY = -17; enesX += 18; }
        else if (enesWallRight) { enesVelY = -17; enesX -= 18; }
        else enesVelY = -17;
    }

    if (e.key === "q") { dashShadow(enes, enesX, enesY); enesX -= 180; }
    if (e.key === "e") { dashShadow(enes, enesX, enesY); enesX += 180; }
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") julLeft = false;
    if (e.key === "ArrowRight") julRight = false;
    if (e.key === "a") enesLeft = false;
    if (e.key === "d") enesRight = false;
});

function applyPhysics(x, y, velY, width, height, wallObj) {
    let prevY = y;
    velY += gravity;
    y += velY;

    let ground = window.innerHeight - height;
    if (y > ground) {
        y = ground;
        velY = 0;
    }

    platforms.forEach(p => {
        let wasAbove = prevY + height <= p.y;
        let isFalling = velY >= 0;
        if (x + width > p.x && x < p.x + p.w && y + height >= p.y && wasAbove && isFalling) {
            y = p.y - height;
            velY = 0;
        }
    });

    wallObj.left = false;
    wallObj.right = false;

    if (x <= 0) {
        x = 0;
        wallObj.left = true;
    }

    if (x + width >= window.innerWidth) {
        x = window.innerWidth - width;
        wallObj.right = true;
    }

    return {x, y, velY};
}

setInterval(() => {
    if (julLeft) julX -= 7;
    if (julRight) julX += 7;

    let julData = applyPhysics(julX, julY, julVelY, 60, 60, {left: julWallLeft, right: julWallRight});
    julX = julData.x;
    julY = julData.y;
    julVelY = julData.velY;
    julWallLeft = julData.left;
    julWallRight = julData.right;

    jul.style.left = julX + "px";
    jul.style.top = julY + "px";

    if (enesLeft) enesX -= 7;
    if (enesRight) enesX += 7;

    let enesData = applyPhysics(enesX, enesY, enesVelY, 70, 70, {left: enesWallLeft, right: enesWallRight});
    enesX = enesData.x;
    enesY = enesData.y;
    enesVelY = enesData.velY;
    enesWallLeft = enesData.left;
    enesWallRight = enesData.right;

    enes.style.left = enesX + "px";
    enes.style.top = enesY + "px";

}, 30);
</script>

</body>
</html>
